name: fitlens
description: "AI-powered fashion assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any

  # AI
  # State Management
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^17.0.0

  # Image Picker
  image_picker: ^1.2.0

  # Image Processing
  image: ^4.5.4
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/